name = "company-values-extractor"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

[ai]
binding = "AI"

[vars]
# This phase's lab raises this from 8,000 to 30,000 — see the README's
# truncation case study for why 8,000 was quietly too small.
MAX_PAGE_CHARS = "8000"
FETCH_TIMEOUT_MS = "8000"
BROWSER_RENDER_TIMEOUT_MS = "25000"

# CLOUDFLARE_ACCOUNT_ID = "your-account-id"
